title: "Software & data"
title_ko: "소프트웨어 & 데이터"
intro: "The open models I build with, the training I give on them, and the datasets and code released with our papers."
intro_ko: "제가 사용하는 공개 모델, 그 모델로 진행하는 교육, 그리고 논문과 함께 공개한 데이터와 코드입니다."

models:
  title: "Models & tools I build with"
  title_ko: "사용하는 모델 · 도구"
  items:
    - name: "Delft3D Flexible Mesh"
      by: "Deltares"
      tag: "3-D hydrodynamics · waves · morphology"
      tag_ko: "3차원 수리동역학 · 파랑 · 지형변화"
      use: "Harvey compound-flood hindcast; Gulf & Puerto Rico surge systems (NRL); Arabian Gulf thermohaline model"
      use_ko: "하비 복합홍수 재현, 멕시코만·푸에르토리코 해일 시스템(NRL), 아라비아만 수온·염분 모델"
      site: "https://oss.deltares.nl/web/delft3dfm"
    - name: "SFINCS"
      by: "Deltares"
      tag: "Reduced-complexity compound flooding · GPU"
      tag_ko: "축약 물리 복합홍수 모델 · GPU"
      use: "Texas probabilistic surge, Gulf-wide 17-zone system, 100-member Hill Country flash-flood ensemble"
      use_ko: "텍사스 확률 해일, 멕시코만 17개 구역 시스템, 힐 컨트리 100개 앙상블 돌발홍수"
      site: "https://sfincs.readthedocs.io/en/latest/"
      code: "https://github.com/Deltares/SFINCS"
      doi: "10.5281/zenodo.20706001"
    - name: "HydroMT-SFINCS"
      by: "Deltares"
      tag: "Automated, reproducible model building"
      tag_ko: "자동화·재현 가능한 모델 구축"
      use: "Scripted SFINCS setups from global & local data for ensembles across basins"
      use_ko: "여러 유역 앙상블을 위해 전 지구·지역 자료로 SFINCS를 스크립트로 구축"
      code: "https://github.com/Deltares/hydromt_sfincs"
      doi: "10.5281/zenodo.20347019"
    - name: "FloodAdapt"
      by: "Deltares"
      tag: "Adaptation planning"
      tag_ko: "적응 대책 계획"
      use: "Floodproofing and pumping scenarios for Lower Rio Grande Valley colonias"
      use_ko: "리오그란데 밸리 콜로니아의 방수·펌프 대책 시나리오"
      code: "https://github.com/Deltares-research/FloodAdapt"
    - name: "Delft-FIAT"
      by: "Deltares"
      tag: "Flood impact & damage"
      tag_ko: "홍수 피해 산정"
      use: "Building- and road-level damage for multi-event risk"
      use_ko: "다중 사건 위험을 위한 건물·도로 단위 피해 산정"
      code: "https://github.com/Deltares/Delft-FIAT"
    - name: "XBeach"
      by: "Deltares"
      tag: "Nearshore storm impacts"
      tag_ko: "연안 폭풍 영향"
      use: "Beach and barrier response to storms"
      use_ko: "폭풍에 대한 해변·사주 반응"
      site: "https://oss.deltares.nl/web/xbeach/"
    - name: "SWAN"
      by: "TU Delft"
      tag: "Spectral waves"
      tag_ko: "스펙트럼 파랑 모델"
      use: "Coupled wave–surge modeling (Harvey, Gulf, Arabian Gulf)"
      use_ko: "파랑–해일 결합 모의 (하비, 멕시코만, 아라비아만)"
      site: "https://swanmodel.sourceforge.io/"
    - name: "WAVEWATCH III"
      by: "NOAA"
      tag: "Ocean wave forecasting"
      tag_ko: "해양 파랑 예보"
      use: "Offshore wave boundary conditions for coastal models"
      use_ko: "연안 모델의 외해 파랑 경계조건"
      code: "https://github.com/NOAA-EMC/WW3"

training:
