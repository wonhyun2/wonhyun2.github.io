      text_ko: "SFINCS·Delft3D-FM 구축, 외력 자료 생성, TACC 고성능컴퓨팅 워크플로, 관측소·흔적수위 검증."
      materials: ""
    - title: "Seminars: hydrodynamic modeling & AI flood prediction"
      title_ko: "세미나: 수리동역학 모델링 & AI 홍수 예측"
