# =====================================================================
#  software.yml  —  Software & Data 섹션
#
#  ▸ groups 안의 items 를 추가/삭제하세요. 링크 종류(모두 선택):
#      site: 공식 홈페이지   code: GitHub   docs: 문서   doi: "10.5281/zenodo.xxxxx"
#      paper: 관련 논문 DOI (예: "10.1029/2025EF007678")
#  ▸ by: 개발 기관 (예: Deltares)      use: 내가 이 도구로 한 일
#  ▸ training 의 materials: 강의자료/슬라이드 링크(있으면) — 비워두면 표시 안 됨
# =====================================================================

title: "Software & data"
title_ko: "소프트웨어 & 데이터"
intro: "Open models for coasts, rivers and floods, the training I give, and the datasets and code released with our papers."
intro_ko: "연안·하천·홍수 모델 소개, 진행하는 교육, 그리고 논문과 함께 공개한 데이터와 코드입니다."

models:
  title: "Hydrodynamic & hydrologic models"
  title_ko: "수리 · 수문 모델"
  note: "Widely used coastal, river and watershed models, grouped by what they simulate. Texas notes follow the Texas Integrated Flooding Framework (TIFF) 2025 Final Report."
  note_ko: "널리 쓰이는 연안·하천·유역 모델을 계산 대상별로 정리했습니다. 텍사스 관련 설명은 텍사스 통합홍수프레임워크(TIFF) 2025 최종보고서를 참고했습니다."
  source: "https://www.texasflood.org/tools-library/tiff/reports.html"
  groups:
    - { key: coastal, name: "Coastal & ocean · storm surge", name_ko: "연안·해양 · 폭풍해일" }
    - { key: waves, name: "Waves & nearshore", name_ko: "파랑 · 연안 근해" }
    - { key: inundation, name: "Flood inundation & river hydraulics", name_ko: "침수 · 하천 수리" }
    - { key: hydrology, name: "Watershed hydrology", name_ko: "유역 수문" }
    - { key: deltares, name: "Deltares workflow · risk · adaptation", name_ko: "Deltares 워크플로 · 위험 · 적응" }

  # ---- 텍사스 모델 인벤토리 (TIFF 2025, Table 3-4) — show_inventory: true 로 바꾸면 막대그래프 표시
  show_inventory: false
  inventory:
    title: "What Texas flood studies run on"
    title_ko: "텍사스 홍수 연구는 무엇으로 돌아가나"
    insight: "Inland studies run almost entirely on HEC-RAS / HEC-HMS / SWAT / TxRR, while coastal studies are split across a dozen codes — the gap a compound-flood framework has to bridge."
    insight_ko: "내륙 연구는 거의 HEC-RAS·HEC-HMS·SWAT·TxRR로, 연안 연구는 십여 개 코드로 나뉘어 있습니다 — 복합홍수 프레임워크가 메워야 할 간극입니다."
    inland:  [["HEC-RAS",305],["SWAT",176],["HEC-HMS",130],["TxRR",129],["SWMM / XPSWMM",14],["InfoWorks ICM",8],["GSSHA",5],["ICPR",1],["RiverWare",1]]
    coastal: [["Delft3D / D-Flow FM",11],["CMS-Flow / Wave",8],["AdH",7],["TxBLEND",7],["ADCIRC",3],["SCHISM / SELFE",3],["STWAVE",2],["Boussinesq (FUNWAVE-type)",2],["COULWAVE",2],["FVCOM",1],["SFINCS",1],["XBeach",1],["WAM",1]]

  items:
    # ================= coastal & ocean
    - name: "Delft3D Flexible Mesh"
      group: coastal
      by: "Deltares"
      tag: "3-D hydrodynamics · waves · morphology"
      tag_ko: "3차원 수리동역학 · 파랑 · 지형변화"
      note: "Flexible-mesh suite for flow, waves, sediment and water quality from rivers to the open ocean."
      note_ko: "하천에서 외해까지 흐름·파랑·퇴적물·수질을 계산하는 유연격자 모델군."
      site: "https://oss.deltares.nl/web/delft3dfm"
    - name: "ADCIRC"
      group: coastal
      by: "ADCIRC consortium"
      tag: "Unstructured-mesh storm surge & tides"
      tag_ko: "비정형 격자 폭풍해일 · 조석"
      note: "Most thoroughly validated for Texas storms; the workhorse of USACE and FEMA coastal design studies."
      note_ko: "텍사스 태풍에 가장 많이 검증된 모델 — USACE·FEMA 연안 설계 연구의 주력."
      site: "https://adcirc.org/"
    - name: "SCHISM"
      group: coastal
      by: "VIMS"
      tag: "Cross-scale 3-D creek-to-ocean model (successor of SELFE)"
      tag_ko: "하천–해양 교차 스케일 3차원 모델 (SELFE 후속)"
      note: "Widely applied for large-scale Texas coastal modeling, with a full 3-D option."
      note_ko: "텍사스 대규모 연안 모델링에 널리 쓰이며 3차원 계산 가능."
      site: "https://ccrm.vims.edu/schismweb/"
    - name: "ROMS"
      group: coastal
      by: "Rutgers / UCLA"
      tag: "Regional Ocean Modeling System — 3-D baroclinic ocean"
      tag_ko: "지역 해양 모델링 시스템 — 3차원 경압 해양"
      note: "Shelf and ocean circulation that sets the boundary for coastal flood models."
      note_ko: "연안 홍수 모델의 경계가 되는 대륙붕·해양 순환."
      site: "https://www.myroms.org/"
    - name: "FVCOM"
      group: coastal
      by: "UMass Dartmouth"
      tag: "Finite-volume 3-D coastal ocean model"
      tag_ko: "유한체적 3차원 연안 해양 모델"
      note: "Comparable surge accuracy to ADCIRC; used in Texas mainly for model intercomparison."
      note_ko: "해일 정확도는 ADCIRC와 비슷하며, 텍사스에서는 주로 모델 비교 연구에 사용."
      code: "https://github.com/FVCOM-GitHub/FVCOM"
    - name: "AdH"
      group: coastal
      by: "USACE ERDC"
      tag: "Adaptive Hydraulics — 2-D/3-D with adaptive meshing"
      tag_ko: "적응 격자 2·3차원 수리 모델"
      note: "Used by USACE districts for bays, navigation channels and estuaries."
      note_ko: "USACE 지구에서 만·항로·하구 연구에 사용."
    - name: "CMS-Flow / CMS-Wave"
      group: coastal
      by: "USACE CIRP"
      tag: "Coastal Modeling System for inlets, navigation and sediment"
      tag_ko: "조류 입구·항로·표사 연구용 연안 모델링 시스템"
      site: "https://cirp.usace.army.mil/products/cms.php"
    - name: "SLOSH"
      group: coastal
      by: "NOAA / NHC"
      tag: "Sea, Lake and Overland Surges from Hurricanes"
      tag_ko: "허리케인 해일 예보 모델"
      note: "Fast operational surge model behind NHC surge guidance; no waves."
      note_ko: "NHC 해일 예보의 근간이 되는 빠른 운영 모델 (파랑 미포함)."
    - name: "TxBLEND"
      group: coastal
      by: "TWDB"
      tag: "Texas bay & estuary circulation and salinity"
      tag_ko: "텍사스 만·하구 순환 · 염분 모델"
      note: "Freshwater-inflow and salinity studies for Texas estuaries."
      note_ko: "텍사스 하구의 담수 유입 · 염분 연구."

    # ================= waves & nearshore
    - name: "SWAN"
      group: waves
      by: "TU Delft"
      tag: "Spectral nearshore waves"
      tag_ko: "스펙트럼 연안 파랑"
      note: "Third-generation spectral wave model for coastal waters."
      note_ko: "연안 해역용 3세대 스펙트럼 파랑 모델."
      site: "https://swanmodel.sourceforge.io/"
    - name: "WAVEWATCH III"
      group: waves
      by: "NOAA"
      tag: "Ocean wave forecasting"
      tag_ko: "해양 파랑 예보"
      note: "NOAA's global and regional ocean wave model."
      note_ko: "NOAA의 전 지구·지역 해양 파랑 모델."
      code: "https://github.com/NOAA-EMC/WW3"
    - name: "XBeach"
      group: waves
      by: "Deltares"
      tag: "Storm impacts on beaches and barriers"
      tag_ko: "해변 · 사주의 폭풍 영향"
      note: "Storm-driven dune erosion, overwash and breaching on sandy coasts."
      note_ko: "모래 해안의 폭풍 침식·월파·사구 붕괴 모델."
      site: "https://oss.deltares.nl/web/xbeach/"
    - name: "STWAVE"
      group: waves
      by: "USACE ERDC"
      tag: "Steady-state spectral nearshore waves"
      tag_ko: "정상상태 스펙트럼 연안 파랑"
      note: "Paired with ADCIRC in USACE/FEMA Texas coastal studies."
      note_ko: "USACE·FEMA 텍사스 연안 연구에서 ADCIRC와 결합해 사용."
    - name: "FUNWAVE-TVD"
      group: waves
      by: "U. Delaware / USACE"
      tag: "Phase-resolving Boussinesq waves"
      tag_ko: "위상분해 Boussinesq 파랑"
      site: "https://fengyanshi.github.io/build/html/index.html"
    - name: "WAM"
      group: waves
      tag: "Third-generation deep-water wave model"
      tag_ko: "3세대 심해 파랑 모델"
      note: "Deep-water storm waves for Texas coastal studies."
      note_ko: "텍사스 연안 연구의 심해 폭풍파 산정."

    # ================= flood inundation & river hydraulics
    - name: "SFINCS"
      group: inundation
      by: "Deltares"
      tag: "Reduced-complexity compound flooding · GPU"
      tag_ko: "축약 물리 복합홍수 모델 · GPU"
      note: "Fast compound flooding from surge, waves, rain and rivers using subgrid topography; runs on GPUs."
      note_ko: "서브그리드 지형으로 해일·파랑·강우·하천 복합홍수를 빠르게 계산 (GPU 지원)."
      site: "https://sfincs.readthedocs.io/en/latest/"
      code: "https://github.com/Deltares/SFINCS"
      doi: "10.5281/zenodo.20706001"
    - name: "HEC-RAS"
      group: inundation
      by: "USACE HEC"
      tag: "1-D/2-D river and floodplain hydraulics"
      tag_ko: "1·2차원 하천 · 홍수터 수리"
      note: "The most common model in Texas flood studies — 305 models in the TIFF inventory."
      note_ko: "텍사스 홍수 연구에서 가장 많이 쓰이는 모델 — TIFF 인벤토리 305개."
      site: "https://www.hec.usace.army.mil/software/hec-ras/"
    - name: "TUFLOW"
      group: inundation
      by: "TUFLOW"
      tag: "1-D/2-D flood, urban stormwater and coastal hydraulics"
      tag_ko: "1·2차원 홍수 · 도시 우수 · 연안 수리"
      site: "https://www.tuflow.com/"
    - name: "MIKE 21 / MIKE 11 / MIKE+"
      group: inundation
      by: "DHI"
      tag: "River, floodplain and coastal hydraulics suite"
      tag_ko: "하천 · 홍수터 · 연안 수리 모델군"
      site: "https://www.dhigroup.com/technologies/mikepoweredbydhi"
    - name: "EPA SWMM / XPSWMM"
      group: inundation
      by: "U.S. EPA"
      tag: "Urban stormwater runoff and sewer networks"
      tag_ko: "도시 우수 유출 · 하수관망"
      site: "https://www.epa.gov/water-research/storm-water-management-model-swmm"
    - name: "InfoWorks ICM"
      group: inundation
      by: "Autodesk"
      tag: "Integrated urban drainage and river modeling"
      tag_ko: "도시 배수 · 하천 통합 모델"
    - name: "LISFLOOD-FP"
      group: inundation
      by: "U. Bristol"
      tag: "Simplified-momentum large-scale inundation"
      tag_ko: "단순 운동량식 광역 침수 모델"
      note: "Same model family as SFINCS: reduced physics for fast, large-area flooding."
      note_ko: "SFINCS와 같은 계열 — 빠른 광역 침수를 위한 축약 물리."

    # ================= watershed hydrology
    - name: "HEC-HMS"
      group: hydrology
      by: "USACE HEC"
      tag: "Event & continuous rainfall–runoff"
      tag_ko: "사상 · 연속 강우–유출"
      note: "Texas planning standard for flood hydrographs."
      note_ko: "텍사스 홍수 계획의 표준 유출 모델."
      site: "https://www.hec.usace.army.mil/software/hec-hms/"
    - name: "WRF-Hydro / National Water Model"
      group: hydrology
      by: "NCAR · NOAA OWP"
      tag: "Distributed hydrology coupled to weather models; operational NWM"
      tag_ko: "기상모델과 결합된 분포형 수문 · 국가 물 모델(NWM)"
      site: "https://ral.ucar.edu/projects/wrf_hydro"
      docs: "https://water.noaa.gov/about/nwm"
    - name: "NextGen (ngen)"
      group: hydrology
      by: "NOAA OWP"
      tag: "Model-agnostic BMI framework for the next National Water Model"
      tag_ko: "차세대 국가 물 모델을 위한 BMI 기반 결합 프레임워크"
      note: "Couples hydrologic models of any kind through the Basic Model Interface (BMI)."
      note_ko: "BMI(Basic Model Interface)로 다양한 수문 모델을 결합."
      code: "https://github.com/NOAA-OWP/ngen"
    - name: "SWAT"
      group: hydrology
      by: "Texas A&M · USDA"
      tag: "Watershed management, water quality and erosion"
      tag_ko: "유역 관리 · 수질 · 침식"
      site: "https://swat.tamu.edu/"
    - name: "TxRR"
      group: hydrology
      by: "TWDB"
      tag: "Texas Rainfall–Runoff model for watersheds and reservoirs"
      tag_ko: "텍사스 유역 · 저수지 강우–유출 모델"
    - name: "VIC"
      group: hydrology
      by: "U. Washington"
      tag: "Large-scale land-surface hydrology"
      tag_ko: "광역 지표 수문"
      site: "https://vic.readthedocs.io/en/master/"
    - name: "PRMS"
      group: hydrology
      by: "USGS"
      tag: "Precipitation–Runoff Modeling System"
      tag_ko: "강수–유출 모델링 시스템"
      site: "https://www.usgs.gov/software/precipitation-runoff-modeling-system-prms"
    - name: "GSSHA"
      group: hydrology
      by: "USACE ERDC"
      tag: "Gridded surface–subsurface hydrology"
      tag_ko: "격자형 지표–지하 수문"
    - name: "MODFLOW"
      group: hydrology
      by: "USGS"
      tag: "Groundwater flow"
      tag_ko: "지하수 흐름"
      note: "USGS standard for groundwater flow; key to surge–groundwater interaction."
      note_ko: "USGS 표준 지하수 흐름 모델 — 해일–지하수 상호작용의 핵심."
      site: "https://www.usgs.gov/mission-areas/water-resources/science/modflow-and-related-programs"
    - name: "RiverWare"
      group: hydrology
      by: "CADSWES"
      tag: "River and reservoir operations"
      tag_ko: "하천 · 저수지 운영"
      site: "https://www.riverware.org/"

    # ================= Deltares workflow · risk · adaptation
    - name: "HydroMT-SFINCS"
      group: deltares
      by: "Deltares"
      tag: "Automated, reproducible model building"
      tag_ko: "자동화·재현 가능한 모델 구축"
      note: "Python toolkit that builds SFINCS models from global and local datasets."
      note_ko: "전 지구·지역 자료로 SFINCS 모델을 구축하는 Python 도구."
      code: "https://github.com/Deltares/hydromt_sfincs"
      doi: "10.5281/zenodo.20347019"
    - name: "TCWiSE"
      group: deltares
      by: "Deltares"
      tag: "Tropical Cyclone Wind Statistical Estimation — synthetic hurricane tracks & wind fields"
      tag_ko: "열대저기압 바람 통계 추정 — 가상 허리케인 경로 · 바람장"
      note: "Generates synthetic tropical-cyclone tracks and wind fields for probabilistic hazard analysis."
      note_ko: "확률론적 재해 분석을 위한 가상 열대저기압 경로·바람장 생성."
      paper: "10.5194/nhess-21-861-2021"
    - name: "OpenEarth"
      group: deltares
      by: "Deltares"
      tag: "Open data, models and tools for marine & coastal projects (OpenEarthTools)"
      tag_ko: "해양 · 연안 프로젝트를 위한 공개 데이터 · 모델 · 도구 (OpenEarthTools)"
      note: "Free and open-source initiative for data, models and tools in marine & coastal engineering."
      note_ko: "해양·연안 공학의 데이터·모델·도구를 위한 무료 오픈소스 이니셔티브."
      site: "https://www.deltares.nl/en/software-and-data/products/openearth"
    - name: "FloodAdapt"
      group: deltares
      by: "Deltares"
      tag: "Adaptation planning"
      tag_ko: "적응 대책 계획"
      note: "Evaluates adaptation and mitigation measures by linking compound-flood and impact models."
      note_ko: "복합홍수·피해 모델을 연결해 적응·저감 대책을 평가."
      code: "https://github.com/Deltares-research/FloodAdapt"
    - name: "Delft-FIAT"
      group: deltares
      by: "Deltares"
      tag: "Flood impact & damage"
      tag_ko: "홍수 피해 산정"
      note: "Fast impact assessment of flood damage to buildings and roads."
      note_ko: "건물·도로의 홍수 피해를 빠르게 산정."
      code: "https://github.com/Deltares/Delft-FIAT"

training:
  title: "Training I give"
  title_ko: "진행하는 교육"
  items:
    - title: "SFINCS modeling lectures"
      title_ko: "SFINCS 모델링 강의"
      where: "UT Austin CAEE · Coastal Hazards Lab"
      where_ko: "UT 오스틴 토목·건축·환경공학과 · 연안재해 연구실"
      text: "Model configuration, compound forcing, validation and reading uncertainty in compound-flood simulations — for Ph.D. and M.S. students."
      text_ko: "모델 구성, 복합 외력, 검증, 복합홍수 모의의 불확실성 해석 — 박사·석사 과정 대상."
      materials: ""
    - title: "Hands-on model training"
      title_ko: "실습형 모델 교육"
      where: "UT Austin · UT Arlington · Texas A&M · BMKG Indonesia"
      text: "SFINCS and Delft3D-FM setup, forcing-data generation, HPC workflows on TACC, and validation against gauges and high-water marks."
      text_ko: "SFINCS·Delft3D-FM 구축, 외력 자료 생성, TACC 고성능컴퓨팅 워크플로, 관측소·흔적수위 검증."
      materials: ""
    - title: "Seminars: hydrodynamic modeling & AI flood prediction"
      title_ko: "세미나: 수리동역학 모델링 & AI 홍수 예측"
      where: "BEG · UT EWRE / Center for Water and the Environment (2025)"
      text: "From first-year graduate students to established researchers."
      text_ko: "대학원 1년차부터 경험 많은 연구자까지 대상."
      materials: ""

data:
  title: "Open data & code from our papers"
  title_ko: "논문과 함께 공개한 데이터 · 코드"
  items:
    - title: "Rapid intensification and relative sea-level rise amplifying compound flooding from Hurricanes Harvey to Beryl"
      type: "Dataset"
      type_ko: "데이터셋"
      authors: "Lee, W. (2025)"
      doi: "10.5281/zenodo.17101618"
      paper: "10.1029/2025EF007678"
      paper_label: "Earth's Future 2026"
    - title: "Physics-informed machine learning for compound flooding prediction"
      type: "Code"
      type_ko: "코드"
      authors: "Yang, H., Lee, J.W. & Lee, W. (2026)"
      doi: "10.5281/zenodo.20411505"
      paper: "10.22541/essoar.15005345/v1"
      paper_label: "Water Resources Research (in review)"
    - title: "PyFlood: coastal flood mapping with high-resolution DEM and land cover"
