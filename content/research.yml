# ---------------------------------------------------------------------
# 연구 모토 — IDEAS  (Research 섹션 바로 아래 어두운 띠로 표시, 지우면 섹션이 사라짐)
# ---------------------------------------------------------------------
approach:
  kicker: "Research motto"
  kicker_ko: "연구 모토"
  title: "Good IDEAS before the water rises"
  title_ko: "물이 차오르기 전에, 좋은 IDEAS를"
  intro: "A leadership framework I learned in the Texas Executive Education Program and now use as my research motto — for every project, every student and every partnership."
  intro_ko: "텍사스 경영자 교육 프로그램에서 배운 리더십 프레임워크로, 이제는 모든 과제와 학생 지도, 협력에 적용하는 연구 모토입니다."
  steps:
    - letter: "I"
      color: "#38bdf8"
      name: "Identify"
      name_ko: "Identify · 파악"
      text: "Who and what is at risk — and which flood drivers matter?"
      text_ko: "누가, 무엇이 위험에 처해 있고 어떤 홍수 요인이 중요한가?"
      example: "July 2025 Hill Country flood (river rose ~8 m in 45 min); colonias flooding outside FEMA zones."
      example_ko: "2025년 7월 힐 컨트리 홍수(45분 만에 수위 약 8 m 상승), FEMA 구역 밖에서 반복 침수되는 콜로니아."
    - letter: "D"
      color: "#2dd4bf"
      name: "Define"
      name_ko: "Define · 정의"
      text: "Turn the problem into a precise, answerable question."
      text_ko: "문제를 정확하고 답할 수 있는 질문으로 바꾼다."
      example: "Where will it flood, how deep, how likely, and how soon — fast enough to act?"
      example_ko: "어디가, 얼마나 깊게, 얼마나 높은 확률로, 얼마나 빨리 잠기는가 — 행동할 수 있을 만큼 빠르게?"
    - letter: "E"
      color: "#a78bfa"
      name: "Explore solutions"
      name_ko: "Explore solutions · 탐색"
      text: "Test many paths, not just one."
      text_ko: "하나가 아닌 여러 해법을 시험한다."
      example: "Physics (Delft3D-FM), fast ensembles (SFINCS), AI surrogates (LSM/FNO), nature-based and engineered measures."
      example_ko: "물리 모델(Delft3D-FM), 빠른 앙상블(SFINCS), AI 대리모델(LSM/FNO), 자연기반·공학적 대책."
    - letter: "A"
      color: "#fb923c"
      name: "Anticipate"
      name_ko: "Anticipate · 대비"
      text: "Plan for uncertainty and for what could go wrong."
      text_ko: "불확실성과 예상치 못한 상황에 미리 대비한다."
      example: "Rainfall ensembles, sea-level rise and subsidence, rapid intensification, storms the model has never seen."
      example_ko: "강우 앙상블, 해수면 상승과 지반 침하, 급속강화, 학습에 없던 폭풍."
    - letter: "S"
      color: "#4ade80"
      name: "Select"
      name_ko: "Select · 선택"
      text: "Choose and deliver what decision-makers can use."
      text_ko: "의사결정자가 실제로 쓸 수 있는 것을 골라 전달한다."
      example: "Probability and time-to-danger maps; FloodAdapt measures that cut damage by >90% at shallow hotspots."
      example_ko: "확률·위험 도달 시간 지도, 얕은 침수 지점의 피해를 90% 이상 줄이는 FloodAdapt 대책."
  credit: "Framework from the Texas Executive Education Program — Bureau of Economic Geology & McCombs School of Business Leadership Program (2025)."
  credit_ko: "텍사스 경영자 교육 프로그램 — 경제지질연구소(BEG) · McCombs 경영대학 리더십 프로그램(2025)에서 배운 프레임워크입니다."
