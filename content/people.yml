# ---------------- Principal Investigator
pi:
  name: "Wonhyun Lee, Ph.D."
  role: "Principal Investigator"
  role_ko: "책임연구자 (Principal Investigator)"
  photo: "assets/img/profile-portrait.jpg"
  positions:
    - "Research Assistant Professor"
    - "Bureau of Economic Geology, Jackson School of Geosciences, The University of Texas at Austin"
  positions_ko:
    - "연구조교수"
    - "텍사스 오스틴 대학교 잭슨 지구과학대학 경제지질연구소(BEG)"
  bio: "I lead research on **compound flooding** — coupling physics-based coastal and hydrologic models, large probabilistic ensembles and physics-aware AI to predict where, how deep and how soon floods arrive, and to support adaptation in Texas and U.S. Gulf communities."
  bio_ko: "**복합홍수** 연구를 이끌고 있습니다. 물리 기반 연안·수문 모델, 대규모 확률 앙상블, 물리 인식 AI를 결합해 홍수가 어디에, 얼마나 깊게, 얼마나 빨리 오는지 예측하고, 텍사스와 미국 멕시코만 지역사회의 적응을 지원합니다."
  background:
    - years: "2022–now"
      years_ko: "2022–현재"
      title: "Research Assistant Professor (PI)"
      title_ko: "연구조교수 (책임연구자)"
      org: "Bureau of Economic Geology, UT Austin"
      org_ko: "UT Austin 경제지질연구소"
    - years: "2018–2021"
      title: "NRC Postdoctoral Fellow"
      title_ko: "NRC 박사후연구원"
      org: "U.S. Naval Research Laboratory, Stennis Space Center"
      org_ko: "미 해군연구소(NRL), 스테니스 우주센터"
    - years: "2018"
      title: "Ph.D., Civil Engineering"
      title_ko: "토목공학 박사"
      org: "Texas A&M University"
      org_ko: "텍사스 A&M 대학교"
    - years: "2012 · 2010"
      title: "M.E. · B.S., Civil Engineering"
      title_ko: "토목공학 석사 · 학사"
      org: "Seoul National University of Science & Technology"
      org_ko: "서울과학기술대학교"
  links:
    - label: "Email"
      label_ko: "이메일"
