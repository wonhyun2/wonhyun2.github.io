mentoring_intro: "I enjoy helping students turn models into insight — from setting up their first modeling and its study domain to publishing their first paper."
mentoring_intro_ko: "학생들이 모델을 통찰로 바꾸어 가는 과정을 돕는 일을 좋아합니다 — 첫 모델과 연구 영역 구축부터 첫 논문 출판까지."

