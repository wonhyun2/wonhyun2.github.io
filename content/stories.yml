title: "Research stories"
title_ko: "연구 이야기"
intro: "Each paper in one picture, one number and three sentences."
intro_ko: "논문 하나를 그림 한 장, 숫자 하나, 세 문장으로."

stories:
  - title: "Rain did most of the damage in Harvey"
    title_ko: "하비 홍수 피해의 대부분은 비 때문이었다"
    number: "60–65%"
    label: "of Harvey flooding came from rainfall"
    label_ko: "하비 침수 중 강우 기여"
    text: "We rebuilt Hurricane Harvey with storm surge, waves, rain and rivers in one model. Switching each driver on and off showed rain dominated — and that the drivers amplify each other. Treating hazards one at a time under-predicts flooding."
    text_ko: "해일·파랑·강우·하천을 한 모델에 넣어 허리케인 하비를 재현했습니다. 요인을 하나씩 켜고 끄자 강우가 지배적이었고, 요인들이 서로를 증폭한다는 것이 드러났습니다. 위험 요인을 따로 보면 홍수를 과소평가합니다."
    venue: "Natural Hazards 2023"
    doi: "10.1007/s11069-023-06247-9"
    color: "#38bdf8"
  - title: "Asking 'how likely?' instead of 'what if?'"
    title_ko: "'만약'이 아니라 '얼마나 가능한가'를 묻다"
    number: "~100"
    label: "storm futures in about 4 hours"
    label_ko: "약 4시간에 태풍 시나리오 100개"
    text: "A fast flood model lets us run a hurricane forecast's possible tracks and strengths as an ensemble. For Hurricane Ike, that turned one forecast into maps of flood probability days before landfall."
    text_ko: "빠른 홍수 모델 덕분에 허리케인 예보의 가능한 경로·강도를 앙상블로 돌릴 수 있습니다. 허리케인 아이크의 경우, 예보 하나가 상륙 며칠 전 침수 확률 지도로 바뀌었습니다."
    image: "assets/img/galveston-ike.jpg"
    venue: "Coastal Engineering 2025"
    doi: "10.1016/j.coastaleng.2025.104721"
    color: "#2dd4bf"
  - title: "Stronger storms on higher seas"
    title_ko: "더 높아진 바다 위의 더 강한 태풍"
    number: "2"
    label: "amplifiers: rapid intensification & sea-level rise"
    label_ko: "증폭 요인: 급격한 강화 & 해수면 상승"
    text: "Comparing Harvey (2017) and Beryl (2024), we show how storms that strengthen quickly near the coast, on top of rising relative sea level, push compound flooding further inland. Historical flood maps alone are no longer enough."
    text_ko: "하비(2017)와 베릴(2024)을 비교해, 해안 근처에서 빠르게 강해지는 태풍이 상승한 상대 해수면 위에서 복합홍수를 더 내륙으로 밀어낸다는 것을 보였습니다. 과거 침수 지도만으로는 부족합니다."
    image: "assets/img/rslr-trend.jpg"
    venue: "Earth's Future 2026"
    doi: "10.1029/2025EF007678"
    color: "#38bdf8"
  - title: "Which driver floods which street — and when"
    title_ko: "어떤 요인이 어느 거리를, 언제 침수시키는가"
    number: "Shapley"
    label: "values split flooding among its drivers"
    label_ko: "값으로 침수를 요인별로 분해"
    text: "Borrowing an idea from game theory, a Ph.D. student I advise attributed compound flooding to surge, rain and rivers in space and time — showing where each driver matters most."
    text_ko: "게임이론의 아이디어를 빌려, 지도 중인 박사과정 학생이 복합홍수를 해일·강우·하천 요인별로 시공간 분해했습니다 — 어디서 어떤 요인이 가장 중요한지 보여줍니다."
    venue: "Journal of Hydrology 2026"
    doi: "10.1016/j.jhydrol.2026.135808"
    color: "#a78bfa"
  - title: "One storm, a hundred outcomes"
    title_ko: "하나의 폭우, 백 가지 결과"
    number: "330×"
    label: "spread in flooded area across 100 rainfall futures"
    label_ko: "100개 강우 시나리오 간 침수 면적 차이"
    text: "For the July 2025 Hill Country flood, small shifts in where rain fell changed flooded area by a factor of 330. Risk lives in the tail — and flood probability jumps from near zero to near certain within 12–18 hours."
    text_ko: "2025년 7월 힐 컨트리 홍수에서, 비가 내린 위치가 조금만 달라져도 침수 면적이 330배까지 달라졌습니다. 위험은 꼬리에 있고, 침수 확률은 12–18시간 안에 거의 0에서 거의 확실로 뛰어오릅니다."
    image: "assets/img/hill-3d.jpg"
    venue: "Journal of Hydrology (in review)"
    venue_ko: "Journal of Hydrology (심사 중)"
    doi: "10.2139/ssrn.7545121"
    color: "#2dd4bf"
  - title: "Physics-quality flood maps in seconds"
    title_ko: "물리 모델 수준의 침수 지도를 수 초 만에"
    number: "0.96"
    label: "flood-extent skill (CSI) on an unseen storm"
    label_ko: "처음 보는 태풍에 대한 침수 범위 정확도(CSI)"
    text: "Neural operators trained on SFINCS simulations of seven Texas hurricanes reproduce Hurricane Beryl's flooding in seconds, with about half the depth error of the earlier FNO."
    text_ko: "텍사스 허리케인 7개의 SFINCS 모의로 학습한 신경연산자가 허리케인 베릴의 침수를 수 초 만에 재현했고, 수심 오차는 기존 FNO의 약 절반이었습니다."
    image: "assets/img/ai-lsm.jpg"
    venue: "ICCV 2023 · in preparation 2026"
    venue_ko: "ICCV 2023 · 2026 준비 중"
    doi: "10.48550/arXiv.2307.16090"
    color: "#a78bfa"
  - title: "Fixing the places floods keep returning to"
    title_ko: "홍수가 계속 돌아오는 곳을 고치다"
    number: ">90%"
    label: "damage cut by 2-ft floodproofing in shallow hotspots"
    label_ko: "얕은 상습 침수지 2피트 방수 시 피해 감소"
    text: "Across five floods in the Lower Rio Grande Valley, we found neighborhoods that flood again and again outside FEMA zones, then tested which fixes — floodproofing or pumps — reduce risk most."
    text_ko: "리오그란데 밸리의 홍수 다섯 건을 분석해 FEMA 구역 밖에서 반복 침수되는 동네를 찾고, 방수와 펌프 중 어떤 대책이 위험을 가장 줄이는지 검증했습니다."
    image: "assets/img/floodadapt-measures.jpg"
    venue: "Int. J. Disaster Risk Reduction (in review)"
    venue_ko: "Int. J. Disaster Risk Reduction (심사 중)"
    doi: "10.2139/ssrn.7228030"
    color: "#fb923c"
