# 소개 (About) — 문단은 리스트 항목 하나씩
bio:
  - "I am a Research Assistant Professor and Principal Investigator at the Bureau of Economic Geology, The University of Texas at Austin. I study how hurricanes, extreme rainfall, rivers and rising seas combine into **compound floods** — and how to forecast them quickly and with uncertainty quantification, so that people can act before the water rises."
  - "My group couples physics-based coastal and hydrologic models (Delft3D-FM, SFINCS, SWAN) with large **probabilistic ensembles**, **AI surrogates** such as Fourier and latent-spectral neural operators, and decision tools like **FloodAdapt** — building toward a flood **digital twin** for the Gulf of America coast and the overland areas (e.g., Texas Hill Country, Lower Rio Grande Valley)."
  - "Before UT Austin I was a National Research Council Postdoctoral Fellow at the U.S. Naval Research Laboratory (NASA Stennis Space Center), working on probabilistic surge and inundation prediction and the ocean's thermohaline response to hurricanes. I received my Ph.D. in Civil Engineering from Texas A&M University, where I modeled 3-D hydrodynamics and desalination impacts in the Arabian/Persian Gulf."
bio_ko:
  - "텍사스 오스틴 대학교(UT Austin) 경제지질연구소(Bureau of Economic Geology)의 연구조교수이자 책임연구자(PI)입니다. 허리케인, 극한 강우, 하천 범람, 해수면 상승이 함께 만들어내는 **복합홍수(compound flooding)**를 연구하며, 물이 차오르기 전에 사람들이 행동할 수 있도록 홍수를 빠르게, 그리고 불확실성을 정량화하여 예측하는 방법을 개발합니다."
  - "물리 기반 연안·수문 모델(Delft3D-FM, SFINCS, SWAN)에 대규모 **확률 앙상블**, 푸리에·잠재스펙트럴 신경연산자 같은 **AI 대리모델**, 그리고 **FloodAdapt** 같은 의사결정 도구를 결합하여, 멕시코만(Gulf of America) 연안과 내륙 지역(텍사스 힐 컨트리, 로어 리오그란데 밸리 등)을 위한 홍수 **디지털 트윈**을 구축하고 있습니다."
  - "UT Austin 이전에는 미 해군연구소(NRL, NASA 스테니스 우주센터)에서 미국 국립연구위원회(NRC) 박사후연구원으로 확률론적 폭풍해일·침수 예측과 허리케인에 대한 해양 열염분 반응을 연구했습니다. 텍사스 A&M 대학교에서 토목공학 박사학위를 받았으며, 아라비아(페르시아)만의 3차원 해수유동과 담수화 배출수 영향을 모델링했습니다."

