news:
  - date: "2026-12"
    tag: talk
    text: "Five presentations at **AGU Fall Meeting 2026** (San Francisco): multi-domain SFINCS across the Gulf, LRGV pluvial flood adaptation, PlanetScope colonias monitoring, LiDAR building-level flash-flood vulnerability in Kerrville and drought and hydrologic variablity in Central Texas Hill County using high-resolution data and ML ."
    text_ko: "**AGU Fall Meeting 2026**(샌프란시스코)에서 5편 발표: 멕시코만 다중 영역 SFINCS, 로어 리오그란데 밸리 내수침수 적응, PlanetScope 콜로니아 모니터링, LiDAR 기반 커빌 건물 단위 돌발홍수 취약성, 고해상도 자료와 머신러닝을 활용한 텍사스 힐 컨트리 중부의 가뭄·수문 변동성."
